name: Suggest an entry
description: Propose a new threat, vulnerability, or guardrail.
labels: ["content"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Entry type
      options: [Threat, Vulnerability, Guardrail]
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description and impact
    validations:
      required: true
  - type: textarea
    id: mapping
    attributes:
      label: Framework mapping
      description: OWASP LLM / Agentic Top 10, MITRE ATLAS, or NIST AI RMF IDs, with links.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Incidents, papers, advisories, or ATLAS case studies that show this occurs in practice.
  - type: input
    id: affiliation
    attributes:
      label: How you use the atlas (optional)
      description: Team, course, or project. Helps show where the atlas is used.
